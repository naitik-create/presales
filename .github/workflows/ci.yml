name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: presales_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: presales_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U presales_app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DATABASE_URL: postgresql+psycopg://presales_app:ci-password@localhost:5432/presales_test
      TEST_DATABASE_URL: postgresql+psycopg://presales_app:ci-password@localhost:5432/presales_test
      SECRETS_ENCRYPTION_KEY: Q2lPbmx5S2V5Rm9yVGVzdHNOb3RVc2VkQW55d2hlcmU=
      MODEL_CACHE_PATH: /tmp/model_cache
      LOCAL_STORAGE_PATH: /tmp/storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enable pgvector
        run: PGPASSWORD=ci-password psql -h localhost -U presales_app -d presales_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check there is only one migration head
        run: |
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then echo "More than one Alembic head; merge the migrations (see CONTRIBUTING.md)"; alembic heads; exit 1; fi
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/model_cache
          key: fastembed-bge-small-en-v1.5
      - name: Run tests
        run: python -m pytest -q -p no:warnings

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
